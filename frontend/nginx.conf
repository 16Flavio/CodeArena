server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DOMjudge contest packages can be hundreds of MB (secret testcases are
  # usually the bulk). Default nginx limit is 1 MB which would 413 every
  # realistic upload. The admin endpoints are the only ones that need it;
  # upstream FastAPI enforces its own caps on submissions (see rate_limit).
  client_max_body_size 500m;

  # ── Security headers ──────────────────────────────────────────────────────
  # Defence-in-depth. The JWT lives in localStorage so an XSS would still
  # exfiltrate it, but a CSP at least makes the XSS itself harder to land.
  # ``always`` makes nginx send the headers even on 4xx/5xx responses.
  #
  # CSP: allow only same-origin scripts/styles/fonts/images/media + the API.
  # ``blob:`` is whitelisted on img-src / frame-src / object-src / media-src
  # because the frontend fetches PDFs (problem statements) and uploaded
  # assets via XHR, then renders them via ``URL.createObjectURL(...)``.
  # Without ``blob:`` on those directives the browser silently refuses to
  # render — the PDF iframe would just show white.
  # ``data:`` on frame-src lets ``CustomWidget.jsx`` load the learning-zone
  # widgets via ``data:text/html;...``. We need this because srcdoc iframes
  # inherit the parent CSP and our ``script-src 'self'`` would otherwise
  # forbid the inline scripts inside the widgets. ``data:`` iframes load
  # in an opaque origin with their own (empty) policy, so the parent CSP
  # does not transfer. Combined with ``sandbox="allow-scripts"`` (no
  # ``allow-same-origin``), the widget remains unable to read the parent's
  # localStorage / cookies, so even malicious widget code cannot lift the JWT.
  # ``'unsafe-inline'`` for styles is required by Tailwind's runtime classes
  # and a few inline ``style=""`` attributes; scripts have no unsafe inline.
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob: data:; object-src 'self' blob:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    always;
  add_header X-Frame-Options "DENY" always;             # legacy, defence-in-depth alongside CSP frame-ancestors
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;       # /reset-password?token=... must NOT leak to external links
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # SPA routing: fall through to index.html for unknown routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API to the backend service (docker-compose service name: backend).
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE settings (scoreboard stream): disable buffering + keep alive.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
  }
}
