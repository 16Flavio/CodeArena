[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::RuntimeWarning
# A hung test must fail with its stack rather than wedge the run. One suite
# run once stalled for 90 minutes with no output and no traceback; the cause
# was never reproduced, so this is the guard rail that will diagnose it if it
# happens again. thread method: dumps every thread's stack on expiry, and
# unlike the signal method it works on Windows. 120s is ~10x the slowest
# legitimate test (the end-to-end ICPC judgings run 5-10s).
timeout = 120
timeout_method = thread
