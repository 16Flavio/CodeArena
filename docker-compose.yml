services:
  backend:
    image: ${DOCKER_USER:-codearena}/codearena-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: codearena-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Pass through from host .env (shared secret, SMTP, etc.). Adjust as needed.
      SECRET_KEY: ${SECRET_KEY:-}
      # HTTP worker count. Default 4 - comfortable for ~200 active users.
      # Each worker is a separate process: more parallelism, more memory.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      # SQLAlchemy pool sizing. Per-worker - total connections is
      # (UVICORN_WORKERS × (DB_POOL_SIZE + DB_MAX_OVERFLOW)) at burst.
      # Defaults give 4 × 25 = 100 burst; postgres max_connections=200.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-15}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SSL: ${SMTP_SSL:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # BOTH of these are read by the app from its own environment, so
      # setting them in .env alone does nothing - Compose only injects
      # what is declared here. They were documented in docs/DEPLOY.md and
      # silently inert for every deployment that set them:
      #  * TRUST_PROXY_HEADERS decides whether X-Forwarded-For is honoured.
      #    Unset behind a reverse proxy, every request looks like it came
      #    from the proxy: the recorded submitter IP is useless for
      #    anti-cheat, and the rate limiter buckets the whole internet
      #    into one key (see backend/rate_limit.py).
      #  * METRICS_TOKEN gates /api/metrics. Unset, the endpoint is open.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SCORING_TIMEOUT_SECONDS: ${SCORING_TIMEOUT_SECONDS:-30}
      SCORING_MODE: ${SCORING_MODE:-subprocess}
      SCORING_IMAGE: ${SCORING_IMAGE:-codearena-scoring:latest}
      # Toolchain image + shared judge workdir for the containerised ICPC
      # sandbox (SCORING_MODE=docker). SCORING_WORKDIR must be a path that is
      # IDENTICAL on host and inside the container (see the volume below), so
      # the sibling sandbox container can bind-mount it at the same path.
      SCORING_ICPC_IMAGE: ${SCORING_ICPC_IMAGE:-codearena-icpc-sandbox:latest}
      SCORING_WORKDIR: ${JUDGE_WORKDIR:-/judge-work}
      SCORING_MEMORY_MB: ${SCORING_MEMORY_MB:-256}
      # A whole core per sandbox (docker --cpus), like the core runguard gets
      # to itself under DOMjudge. Do NOT lower this: judging is decided on
      # CPU time but killed on the wall clock, so throttling to 0.5 halves
      # the CPU a submission can spend before the wall limit fires, and it
      # also doubles every compile. Isolate concurrent judgings with
      # SCORING_CPUSET instead. The judge compensates for a value below 1,
      # but it cannot make it fast.
      SCORING_CPUS: ${SCORING_CPUS:-1.0}
      # How far past the soft time limit a submission may run before being
      # killed (DOMjudge's timelimit_overshoot syntax: absolute|relative).
      # The verdict is still decided on the soft limit; the margin only
      # exists so an overrun reports a real runtime instead of the limit.
      SCORING_TIMELIMIT_OVERSHOOT: ${SCORING_TIMELIMIT_OVERSHOOT:-1s|10%}
      # Mirrored from the worker: with REDIS_URL unset the backend judges
      # in-process, and that fallback should honour the same pinning.
      SCORING_CPUSET: ${SCORING_CPUSET:-}
      # Composed URL uses the postgres service below. Override DATABASE_URL
      # in .env if you want to point at an external DB instead.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-codearena}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codearena}}
      # Redis/RQ scoring queue. Unset = fallback to in-process thread pool -
      # which would ALSO mean judging inside the web container again, so the
      # docker.sock and judge-workdir mounts removed below have to come back.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCORING_QUEUE_NAME: ${SCORING_QUEUE_NAME:-scoring}
      # Learn "run this exercise": its own queue, drained by learn-worker, so
      # a student's spinner never waits behind a multi-minute ICPC judging.
      LESSON_QUEUE_NAME: ${LESSON_QUEUE_NAME:-lesson-runs}
      # How long the web request blocks on a worker before returning 503.
      LESSON_RUN_WAIT_SECONDS: ${LESSON_RUN_WAIT_SECONDS:-60}
      # Same, for the synchronously-awaited admin paths (rescore, the
      # "test this scoring script" button). Defaults to the script timeout + 30s.
      SCORING_SYNC_WAIT_SECONDS: ${SCORING_SYNC_WAIT_SECONDS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      # User-uploaded artefacts (submissions, statements, DOMjudge
      # packages). Bind-mounted to a host directory so they're visible,
      # backupable with plain tar, and can't be wiped by a stray
      # ``docker volume prune`` the way a named volume could. Set
      # UPLOADS_DIR in .env to move it elsewhere.
      - ${UPLOADS_DIR:-./uploads}:/app/backend/uploads
      # NO /var/run/docker.sock here, on purpose. This is the only container
      # reachable from the internet, and the socket is root-equivalent on the
      # host: an RCE in FastAPI would own the box. Everything that spawns a
      # sandbox container now runs on a worker instead:
      #   * contestant submissions  -> enqueue_scoring (always was)
      #   * Learn "run this exercise" -> lesson-runs queue (learn-worker)
      #   * rescore / test-scoring  -> scoring queue, synchronously awaited
      # The judge workdir mount is gone with it - only the workers build in it.
      # Both are required again if you ever run WITHOUT Redis, since the
      # backend then falls back to judging in-process.
    # Internal only - Caddy is the one public-facing service. For local dev
    # without Caddy, add `ports: - "8000:8000"`.
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: ${DOCKER_USER:-codearena}/codearena-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: codearena-frontend
    depends_on:
      - backend
    # Bind only to localhost so the host's nginx (or Caddy) can proxy to it.
    # 127.0.0.1 prefix is important - without it the port would be public.
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-2027}:80"
    restart: unless-stopped

  caddy:
    # Opt-in: only starts with `docker compose --profile edge-caddy up -d`.
    # Skip it if the host already runs nginx/Traefik/etc. terminating TLS.
    image: caddy:2.8-alpine
    container_name: codearena-caddy
    profiles: [ "edge-caddy" ]
    depends_on:
      - frontend
    # Bind to a loopback port by default so a host-level nginx/Traefik
    # can proxy in front of Caddy without port clashes. Override via
    # .env (CADDY_BIND=0.0.0.0 and CADDY_HOST_PORT=80) if Caddy IS the
    # edge of your deployment.
    ports:
      - "${CADDY_BIND:-127.0.0.1}:${CADDY_HOST_PORT:-9080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: codearena-postgres
    # Stock postgres ships with max_connections=100. With UVICORN_WORKERS=4
    # and the SQLAlchemy pool sized to burst at 25/worker (= 100 across
    # backend + ~10 across workers + headroom for psql / pg_dump), 100 is
    # the floor. 200 leaves room for spikes and admin sessions.
    # shared_buffers bumped accordingly - postgres' default 128MB is
    # tiny for our row volume; 256MB is still conservative.
    command:
      - "postgres"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-codearena}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No host port - backend reaches it via the internal docker network only.
    # Uncomment the ports block if you need to connect with psql from the host.
    # ports:
    #   - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codearena}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Scoring queue broker. Persistence is ON so an in-flight RQ job
    # survives a restart: AOF flushes every second + a periodic RDB
    # snapshot. Redis data is tiny (the queue, not submission blobs),
    # so a named volume is cheap.
    image: redis:7-alpine
    container_name: codearena-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60 1"
      - --save
      - "300 10"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    # Horizontally scalable scoring worker. Uses the same image as the
    # backend (shares scoring_runner + scoring_jobs). Runs
    # ``python -m backend.worker`` which consumes the Redis queue; does
    # NOT expose any HTTP port.
    #
    # The replica count is driven by SCORING_WORKER_REPLICAS in .env
    # (default 1). ``deploy.replicas`` is honored by ``docker compose
    # up -d`` since Compose v2.13, so bumping the env var + plain
    # ``up -d`` is enough to scale permanently across restarts - no
    # more ``--scale`` flag to remember.
    image: ${DOCKER_USER:-codearena}/codearena-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
    deploy:
      replicas: ${SCORING_WORKER_REPLICAS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-codearena}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codearena}}
      # Worker DB pool - much smaller than the backend's. Each worker
      # is a single-threaded RQ consumer holding 1 connection at a time.
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-3}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCORING_QUEUE_NAME: ${SCORING_QUEUE_NAME:-scoring}
      SCORING_TIMEOUT_SECONDS: ${SCORING_TIMEOUT_SECONDS:-30}
      SCORING_MODE: ${SCORING_MODE:-subprocess}
      SCORING_IMAGE: ${SCORING_IMAGE:-codearena-scoring:latest}
      SCORING_ICPC_IMAGE: ${SCORING_ICPC_IMAGE:-codearena-icpc-sandbox:latest}
      SCORING_WORKDIR: ${JUDGE_WORKDIR:-/judge-work}
      SCORING_MEMORY_MB: ${SCORING_MEMORY_MB:-256}
      # A whole core per sandbox; see the backend service for why lowering
      # this costs both correctness and speed.
      SCORING_CPUS: ${SCORING_CPUS:-1.0}
      SCORING_TIMELIMIT_OVERSHOOT: ${SCORING_TIMELIMIT_OVERSHOOT:-1s|10%}
      # Cores the sandbox containers are pinned to (docker --cpuset-cpus).
      # Unset = no pinning. Set this when you run more than one worker: two
      # judgings sharing a core inflate each other's wall clock, and the
      # anti-idle hard limit is wall-based. DOMjudge does the same with one
      # judgedaemon per core (``judgedaemon -n <core>``).
      #
      # NOTE: with replicas > 1 every worker inherits the same value, so all
      # replicas would share one core. For true per-core isolation, declare
      # the workers as separate services with their own SCORING_CPUSET
      # (worker-0 -> "2", worker-1 -> "3", ...) instead of using replicas.
      SCORING_CPUSET: ${SCORING_CPUSET:-}
      # Alternative OCI runtime for every sandbox container, e.g. "runsc"
      # (gVisor), which must be declared in the host's /etc/docker/daemon.json.
      # Unset = the daemon's default (runc). NOTE: gVisor intercepts syscalls
      # in userspace, so syscall-heavy submissions slow down while pure
      # computation barely moves - and verdicts here are decided on CPU time.
      # Re-check the time limits of already-imported problems after switching.
      SCORING_RUNTIME: ${SCORING_RUNTIME:-}
      # This worker drains contest judging only; the Learn queue has its own
      # service below so the two can't starve each other.
      WORKER_QUEUES: ${SCORING_QUEUE_NAME:-scoring}
    volumes:
      - ${UPLOADS_DIR:-./uploads}:/app/backend/uploads
      # The socket lives HERE rather than on the backend: workers are not
      # reachable from the internet, so root-equivalence on the host is not
      # one HTTP bug away. (It is still root-equivalence - a sandbox escape
      # lands on the host as root either way. Closing that needs a rootless
      # or gVisor daemon for judging; see SCORING_RUNTIME and docs/DEPLOY.md.)
      - /var/run/docker.sock:/var/run/docker.sock
      # Same-path shared judge workdir - see icpc_sandbox.py for why.
      - ${JUDGE_WORKDIR:-/judge-work}:${JUDGE_WORKDIR:-/judge-work}
    command: [ "python", "-m", "backend.worker" ]
    restart: unless-stopped

  learn-worker:
    # Drains the Learn "run this exercise" queue, and only that queue.
    #
    # Same image and same sandbox as the judging worker - the separation is
    # about latency, not isolation. A Learn run has a student watching a
    # spinner and finishes in seconds; an ICPC judging can hold a worker for
    # minutes. On a shared queue the spinner would sit behind the contest
    # backlog, so the whole point of moving this off the backend would be
    # traded for an unusable button.
    image: ${DOCKER_USER:-codearena}/codearena-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
    deploy:
      replicas: ${LEARN_WORKER_REPLICAS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-codearena}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codearena}}
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-3}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_QUEUES: ${LESSON_QUEUE_NAME:-lesson-runs}
      SCORING_MODE: ${SCORING_MODE:-subprocess}
      SCORING_ICPC_IMAGE: ${SCORING_ICPC_IMAGE:-codearena-icpc-sandbox:latest}
      SCORING_WORKDIR: ${JUDGE_WORKDIR:-/judge-work}
      SCORING_MEMORY_MB: ${SCORING_MEMORY_MB:-256}
      SCORING_CPUS: ${SCORING_CPUS:-1.0}
      SCORING_TIMELIMIT_OVERSHOOT: ${SCORING_TIMELIMIT_OVERSHOOT:-1s|10%}
      SCORING_RUNTIME: ${SCORING_RUNTIME:-}
      # Pin Learn runs to their own core(s) if the judging workers are pinned,
      # or a contest judging and a lesson run will inflate each other's wall
      # clock - and the anti-idle hard limit is wall-based.
      SCORING_CPUSET: ${LEARN_SCORING_CPUSET:-}
    volumes:
      - ${UPLOADS_DIR:-./uploads}:/app/backend/uploads
      - /var/run/docker.sock:/var/run/docker.sock
      - ${JUDGE_WORKDIR:-/judge-work}:${JUDGE_WORKDIR:-/judge-work}
    command: [ "python", "-m", "backend.worker" ]
    restart: unless-stopped

  scoring-image:
    # Build-only helper: `docker compose build scoring-image` materialises the
    # SCORING_IMAGE tag used when SCORING_MODE=docker. This service never runs;
    # `profiles: ["build-only"]` keeps `docker compose up` from touching it.
    image: ${DOCKER_USER:-codearena}/codearena-scoring:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.scoring
    profiles: [ "build-only" ]
    command: [ "true" ]

  icpc-sandbox:
    # Build-only helper for the containerised ICPC judging sandbox
    # (SCORING_MODE=docker). Carries g++, gcc, javac, python3. Build with:
    #   docker compose --profile build-only build icpc-sandbox
    # then tag/point SCORING_ICPC_IMAGE at it. Never runs as a service.
    image: ${SCORING_ICPC_IMAGE:-codearena-icpc-sandbox:latest}
    build:
      context: .
      dockerfile: Dockerfile.icpc-sandbox
    profiles: [ "build-only" ]
    command: [ "true" ]

  backup:
    # One-shot backup helper. Run with:
    #   docker compose run --rm backup
    #
    # Dumps the Postgres DB to a .sql.gz plus a tarball of the uploads
    # volume, both timestamped under ./backups on the host. Exits as
    # soon as the snapshot is done - schedule via host cron if you want
    # nightly backups, e.g.
    #   0 2 * * * cd /opt/codearena && docker compose run --rm backup
    image: postgres:16-alpine
    container_name: codearena-backup
    profiles: [ "backup" ]
    depends_on:
      - postgres
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-codearena}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      PGDATABASE: ${POSTGRES_DB:-codearena}
    volumes:
      - ${UPLOADS_DIR:-./uploads}:/uploads:ro
      - ./backups:/backups
    entrypoint: [ "/bin/sh", "-c" ]
    command: >-
      "set -e;
       stamp=$$(date +%Y%m%d-%H%M%S);
       db_out=/backups/codearena-$${stamp}.sql.gz;
       up_out=/backups/codearena-uploads-$${stamp}.tar.gz;
       echo 'dumping postgres -> '$${db_out};
       pg_dump --no-owner --no-privileges --format=plain | gzip -c >$${db_out};
       echo 'packing uploads -> '$${up_out};
       tar -czf $${up_out} -C /uploads . 2>/dev/null || true;
       # keep only the 30 most recent of each kind
       ls -1t /backups/codearena-*.sql.gz    | tail -n +31 | xargs -r rm -f --;
       ls -1t /backups/codearena-uploads-*.tar.gz | tail -n +31 | xargs -r rm -f --;
       echo 'done'"
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
