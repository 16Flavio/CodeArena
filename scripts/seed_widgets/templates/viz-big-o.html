<style>
  canvas { width: 100%; max-width: 100%; display: block; background: transparent; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; margin-top: 6px;
            justify-content: center; color: #71717a; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .swatch { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
  .nval { font-weight: 700; color: #3a6690; min-width: 36px; display: inline-block; text-align: right; }
  html.dark .legend { color: #a1a1aa; }
  html.dark .nval { color: #9cbbd6; }
</style>
<div class="stage">
  <canvas id="cv" width="600" height="280"></canvas>
  <div class="legend" id="legend"></div>
</div>
<div class="controls">
  <label class="field">n max <input type="range" min="10" max="200" value="50" id="rng" /></label>
  <span class="nval" id="nval">50</span>
  <label class="field"><input type="checkbox" id="logy" /> log Y</label>
</div>
<script>
(function () {
  var fns = [
    { name: '1',       fn: function (n) { return 1; },                                color: '#a1a1aa' },
    { name: 'log n',   fn: function (n) { return Math.max(0.01, Math.log2(n)); },     color: '#3b82f6' },
    { name: 'n',       fn: function (n) { return n; },                                color: '#10b981' },
    { name: 'n log n', fn: function (n) { return n * Math.max(0.01, Math.log2(n)); }, color: '#4b7ca8' },
    { name: 'n²',      fn: function (n) { return n * n; },                            color: '#f97316' },
    { name: '2ⁿ',      fn: function (n) { return Math.min(1e18, Math.pow(2, n)); },   color: '#ef4444' },
  ];
  var cv     = document.getElementById('cv');
  var ctx    = cv.getContext('2d');
  var rng    = document.getElementById('rng');
  var nval   = document.getElementById('nval');
  var logy   = document.getElementById('logy');
  var legend = document.getElementById('legend');
  legend.innerHTML = fns.map(function (f) {
    return '<span><span class="swatch" style="background:' + f.color + '"></span>' + f.name + '</span>';
  }).join('');

  function isDark() {
    // The app theme is stamped as a class on the iframe's <html>
    // (the OS preference is irrelevant: the app theme is user-toggled).
    return document.documentElement.classList.contains('dark');
  }

  function draw() {
    var N = parseInt(rng.value, 10);
    nval.textContent = N;
    var W = cv.clientWidth || 600;
    var H = 280;
    if (cv.width !== W) cv.width = W;
    if (cv.height !== H) cv.height = H;
    ctx.clearRect(0, 0, W, H);
    var pad = { l: 36, r: 12, t: 10, b: 24 };
    var w = W - pad.l - pad.r;
    var h = H - pad.t - pad.b;
    var dark = isDark();
    var maxY = 0;
    for (var i = 0; i < fns.length; i++) {
      for (var n = 1; n <= N; n++) maxY = Math.max(maxY, fns[i].fn(n));
    }
    if (logy.checked) maxY = Math.log10(maxY + 1);
    if (maxY <= 0) maxY = 1;
    ctx.strokeStyle = dark ? 'rgba(148,163,184,0.4)' : 'rgba(100,116,139,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, pad.t + h); ctx.lineTo(pad.l + w, pad.t + h);
    ctx.stroke();
    ctx.lineWidth = 2;
    for (var i = 0; i < fns.length; i++) {
      var f = fns[i];
      ctx.strokeStyle = f.color;
      ctx.beginPath();
      var first = true;
      for (var n = 1; n <= N; n++) {
        var y = f.fn(n);
        if (logy.checked) y = Math.log10(y + 1);
        var px = pad.l + (n - 1) / Math.max(1, (N - 1)) * w;
        var py = pad.t + h - (y / maxY) * h;
        if (py < pad.t) py = pad.t;
        if (first) { ctx.moveTo(px, py); first = false; }
        else       { ctx.lineTo(px, py); }
      }
      ctx.stroke();
    }
    ctx.fillStyle = dark ? '#a1a1aa' : '#71717a';
    ctx.font = '11px system-ui';
    ctx.fillText('n', pad.l + w - 8, pad.t + h + 16);
    ctx.fillText(logy.checked ? 'log T(n)' : 'T(n)', 4, pad.t + 8);
  }

  rng.addEventListener('input', draw);
  logy.addEventListener('change', draw);
  window.addEventListener('resize', draw);
  draw();
})();
</script>
