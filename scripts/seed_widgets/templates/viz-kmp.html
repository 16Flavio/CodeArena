<style>
  .kmp-stage { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 4px 0; }
  .kmp-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
               color: #3a6690; align-self: flex-start; }
  .kmp-scroll { max-width: 100%; overflow-x: auto; display: flex; flex-direction: column; gap: 6px; }
  .kmp-row { display: flex; gap: 4px; flex-wrap: nowrap; padding: 2px; width: max-content; }
  .kmp-col { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 0 0 auto; }
  .kmp-cell { width: 30px; height: 34px; display: flex; align-items: center; justify-content: center;
              border-radius: 6px; background: #e4e4e7; color: #3f3f46;
              font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 700; font-size: 15px;
              transition: background 0.2s, color 0.2s; }
  .kmp-cell.spacer { background: transparent; }
  .kmp-cell.dim { background: #ececee; color: #b4b4bb; }
  .kmp-cell.done { background: #d7e2ec; color: #2b4a68; }
  .kmp-cell.cur { background: #f97316; color: #fff; }
  .kmp-cell.cmp { background: #3a6690; color: #fff; }
  .kmp-cell.bad { background: #dc2626; color: #fff; }
  .kmp-cell.hit { background: #16a34a; color: #fff; }
  .kmp-idx { font-size: 10px; color: #a1a1aa; font-family: ui-monospace, monospace; height: 12px; }
  .kmp-ptr { font-size: 11px; height: 14px; font-weight: 700; color: #3a6690;
             font-family: ui-monospace, monospace; }
  .kmp-pi { width: 30px; height: 22px; display: flex; align-items: center; justify-content: center;
            border-radius: 5px; background: #f4f4f5; color: #b4b4bb; font-size: 12px; font-weight: 700;
            font-family: ui-monospace, monospace; flex: 0 0 auto; }
  .kmp-pi.set { background: #eef2f6; color: #2b4a68; }
  .kmp-pi.now { background: #3a6690; color: #fff; }
  html.dark .kmp-cell { background: #3f3f46; color: #e4e4e7; }
  html.dark .kmp-cell.spacer { background: transparent; }
  html.dark .kmp-cell.dim { background: #2a2a2e; color: #6b6b73; }
  html.dark .kmp-cell.done { background: #2b3e50; color: #cbd9e6; }
  html.dark .kmp-idx { color: #71717a; }
  html.dark .kmp-ptr { color: #9cbbd6; }
  html.dark .kmp-label { color: #9cbbd6; }
  html.dark .kmp-pi { background: #2a2a2e; color: #6b6b73; }
  html.dark .kmp-pi.set { background: #2b3e50; color: #cbd9e6; }
</style>
<div class="stage kmp-stage" id="stage"></div>
<div class="info-line" id="info"></div>
<div class="meta-row" id="meta"></div>
<div class="controls">
  <label class="field">texte <input type="text" id="text" value="abxabcabcaby" /></label>
  <label class="field">motif <input type="text" id="pattern" value="abcaby" /></label>
  <button class="btn-icon-secondary" id="reset" title="load"></button>
  <button class="btn-icon-secondary" id="step" title="step"></button>
  <button class="btn-icon-primary" id="run" title="run"></button>
</div>
<script>
(function () {
  document.getElementById('reset').innerHTML = window.__svg('load');
  document.getElementById('step').innerHTML = window.__svg('step');
  document.getElementById('run').innerHTML = window.__svg('play');

  var stage = document.getElementById('stage');
  var info = document.getElementById('info');
  var meta = document.getElementById('meta');
  var textInput = document.getElementById('text');
  var patInput = document.getElementById('pattern');

  var params = window.__params || {};
  if (params.text != null) textInput.value = String(params.text);
  if (params.pattern != null) patInput.value = String(params.pattern);

  var T = '', P = '', steps = [], cur = 0, timer = null;

  function esc(c) { return c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '&' ? '&amp;' : c; }

  // Phase 1 : construction de la fonction prefixe pi du motif.
  function buildPi(s) {
    var n = s.length, pi = new Array(n).fill(0), st = [];
    st.push({ phase: 'pi', ci: 0, cj: -1, pi: pi.slice(), upto: 0, setidx: -1,
      msg: 'pi[0] = 0 : un seul caractere n\'a pas de bord propre' });
    for (var i = 1; i < n; i++) {
      var j = pi[i - 1];
      while (j > 0 && s[i] !== s[j]) {
        st.push({ phase: 'pi', ci: i, cj: j, pi: pi.slice(), upto: i - 1, setidx: -1,
          msg: 'motif[' + i + ']="' + s[i] + '" != motif[' + j + ']="' + s[j] + '"  ->  repli j = pi[' + (j - 1) + '] = ' + pi[j - 1] });
        j = pi[j - 1];
      }
      if (s[i] === s[j]) {
        st.push({ phase: 'pi', ci: i, cj: j, pi: pi.slice(), upto: i - 1, setidx: -1,
          msg: 'motif[' + i + ']="' + s[i] + '" == motif[' + j + ']="' + s[j] + '"  ->  j = ' + (j + 1) });
        j += 1;
      } else {
        st.push({ phase: 'pi', ci: i, cj: 0, pi: pi.slice(), upto: i - 1, setidx: -1,
          msg: 'motif[' + i + ']="' + s[i] + '" != motif[0]  ->  pas de bord, j = 0' });
      }
      pi[i] = j;
      st.push({ phase: 'pi', ci: i, cj: -1, pi: pi.slice(), upto: i, setidx: i,
        msg: 'pi[' + i + '] = ' + j + (j > 0 ? '  (bord de longueur ' + j + ')' : '') });
    }
    return { steps: st, pi: pi };
  }

  // Phase 2 : recherche du motif dans le texte en reutilisant pi.
  function buildMatch(s, t, pi) {
    var st = [], m = s.length, j = 0, found = 0;
    for (var i = 0; i < t.length; i++) {
      while (j > 0 && t[i] !== s[j]) {
        st.push({ phase: 'match', ti: i, pj: j, offset: i - j, kind: 'mismatch', found: found,
          msg: 'texte[' + i + ']="' + t[i] + '" != motif[' + j + ']="' + s[j] + '"  ->  decalage : j = pi[' + (j - 1) + '] = ' + pi[j - 1] });
        j = pi[j - 1];
      }
      if (t[i] === s[j]) {
        st.push({ phase: 'match', ti: i, pj: j, offset: i - j, kind: 'match', found: found,
          msg: 'texte[' + i + ']="' + t[i] + '" == motif[' + j + ']="' + s[j] + '"  ->  j = ' + (j + 1) });
        j += 1;
      } else {
        st.push({ phase: 'match', ti: i, pj: 0, offset: i, kind: 'mismatch0', found: found,
          msg: 'texte[' + i + ']="' + t[i] + '" != motif[0]  ->  on avance dans le texte' });
      }
      if (j === m) {
        var start = i - m + 1;
        found += 1;
        st.push({ phase: 'match', ti: i, pj: m - 1, offset: start, kind: 'found', matchStart: start, found: found,
          msg: 'j = ' + m + ' = longueur du motif  ->  correspondance trouvee a l\'indice ' + start });
        j = pi[j - 1];
      }
    }
    return st;
  }

  function renderPi(st) {
    var h = '<div class="kmp-label">Phase 1 - fonction prefixe pi du motif</div>';
    h += '<div class="kmp-scroll"><div class="kmp-row">';
    for (var k = 0; k < P.length; k++) {
      var cls = 'kmp-cell', ptr = '';
      if (k === st.ci && k === st.cj) { cls += ' cur'; ptr = 'i,j'; }
      else if (k === st.ci) { cls += ' cur'; ptr = 'i'; }
      else if (k === st.cj) { cls += ' cmp'; ptr = 'j'; }
      else if (k <= st.upto) { cls += ' done'; }
      else { cls += ' dim'; }
      h += '<div class="kmp-col"><div class="kmp-ptr">' + ptr + '</div><div class="' + cls + '">' +
           esc(P[k]) + '</div><div class="kmp-idx">' + k + '</div></div>';
    }
    h += '</div><div class="kmp-row">';
    for (var k2 = 0; k2 < P.length; k2++) {
      var pcls = 'kmp-pi';
      if (k2 === st.setidx) pcls += ' now';
      else if (k2 <= st.upto) pcls += ' set';
      h += '<div class="' + pcls + '">' + (k2 <= st.upto ? st.pi[k2] : '.') + '</div>';
    }
    h += '</div></div>';
    return h;
  }

  function renderMatch(st) {
    var m = P.length;
    var h = '<div class="kmp-label">Phase 2 - recherche dans le texte via pi</div>';
    h += '<div class="kmp-scroll"><div class="kmp-row">';
    for (var k = 0; k < T.length; k++) {
      var cls = 'kmp-cell', ptr = '';
      if (st.kind === 'found' && k >= st.matchStart && k < st.matchStart + m) { cls += ' hit'; }
      else if (k === st.ti) { cls += (st.kind === 'match') ? ' cur' : ' bad'; ptr = 'i'; }
      else if (k >= st.offset && k < st.offset + st.pj) { cls += ' done'; }
      h += '<div class="kmp-col"><div class="kmp-ptr">' + ptr + '</div><div class="' + cls + '">' +
           esc(T[k]) + '</div><div class="kmp-idx">' + k + '</div></div>';
    }
    h += '</div><div class="kmp-row">';
    for (var sp = 0; sp < st.offset; sp++) {
      h += '<div class="kmp-col"><div class="kmp-ptr"></div><div class="kmp-cell spacer"></div><div class="kmp-idx"></div></div>';
    }
    for (var q = 0; q < m; q++) {
      var pcls = 'kmp-cell', pptr = '';
      if (st.kind === 'found') { pcls += ' hit'; }
      else if (q === st.pj) { pcls += (st.kind === 'match') ? ' cmp' : ' bad'; pptr = 'j'; }
      else if (q < st.pj) { pcls += ' done'; }
      else { pcls += ' dim'; }
      h += '<div class="kmp-col"><div class="kmp-ptr">' + pptr + '</div><div class="' + pcls + '">' +
           esc(P[q]) + '</div><div class="kmp-idx">' + q + '</div></div>';
    }
    h += '</div></div>';
    return h;
  }

  function render() {
    var st = steps[cur] || {};
    stage.innerHTML = (st.phase === 'pi') ? renderPi(st) : renderMatch(st);
    info.textContent = st.msg || '';
    var phase = st.phase === 'pi' ? 'prefixe' : 'recherche';
    var f = st.found != null ? st.found : 0;
    meta.innerHTML = '<span>phase <b>' + phase + '</b></span>' +
      '<span>etape <b>' + Math.min(cur + 1, steps.length) + '</b>/' + steps.length + '</span>' +
      '<span>correspondances <b>' + f + '</b></span>';
  }

  function load() {
    stopRun();
    T = textInput.value || '';
    P = patInput.value || '';
    if (!P.length) P = 'a';
    if (!T.length) T = 'a';
    var pi = buildPi(P);
    steps = pi.steps.concat(buildMatch(P, T, pi.pi));
    cur = 0;
    render();
  }
  function step() { if (cur < steps.length - 1) { cur++; render(); } }
  function run() {
    if (timer) return;
    if (cur >= steps.length - 1) cur = 0;
    var tick = function () {
      step();
      if (cur >= steps.length - 1) { timer = null; return; }
      timer = setTimeout(tick, 600);
    };
    timer = setTimeout(tick, 600);
  }
  function stopRun() { if (timer) { clearTimeout(timer); timer = null; } }

  document.getElementById('reset').addEventListener('click', load);
  document.getElementById('step').addEventListener('click', function () { stopRun(); step(); });
  document.getElementById('run').addEventListener('click', run);

  load();
})();
</script>
