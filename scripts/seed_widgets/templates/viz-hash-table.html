<style>
  .ht-table { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start;
              justify-content: center; padding: 4px 0; }
  .ht-bucket { min-width: 56px; }
  .ht-bucket-head { padding: 4px 8px; background: #e4ebe8; text-align: center; font-weight: 600;
                    font-size: 12px; border-radius: 6px 6px 0 0; color: #3b504c; }
  .ht-bucket-list { padding: 4px; background: #e4ebe8; border-radius: 0 0 6px 6px; min-height: 28px;
                    display: flex; flex-direction: column; gap: 3px; }
  .ht-key { padding: 2px 6px; background: #2f9a8d; color: white; border-radius: 4px;
            font-size: 12px; text-align: center; animation: ht-fadein 0.3s ease-out; }
  .ht-key.collide { background: #f97316; }
  @keyframes ht-fadein { from { opacity: 0; transform: scale(0.6);} to { opacity: 1; transform: scale(1);} }
  @media (prefers-color-scheme: dark) {
    .ht-bucket-head { background: #3b504c; color: #e4ebe8; }
    .ht-bucket-list { background: #243735; }
  }
</style>
<div class="stage">
  <div class="ht-table" id="tbl"></div>
</div>
<div class="info-line" id="status">&nbsp;</div>
<div class="controls">
  <label class="field">m <input type="number" id="m" value="7" min="2" max="24" /></label>
  <label class="field">clé <input type="number" id="k" value="42" /></label>
  <button class="btn-icon-primary"   id="ins"   title="insérer la clé"></button>
  <button class="btn-icon-secondary" id="reset" title="reset"></button>
</div>
<script>
(function () {
  document.getElementById('ins').innerHTML   = window.__svg('plus');
  document.getElementById('reset').innerHTML = window.__svg('reset');

  var params = window.__params || {};
  var rawKeys = (params.keys || '').toString();
  var initial = rawKeys.split(/[^\-0-9]+/).filter(function (s) { return s.length; }).map(Number);
  var mEl = document.getElementById('m');
  var kEl = document.getElementById('k');
  var statusEl = document.getElementById('status');
  var tblEl = document.getElementById('tbl');
  var m = parseInt(mEl.value, 10);
  var buckets = [];
  var lastInsertedAt = -1;

  function reset() {
    m = parseInt(mEl.value, 10);
    if (!(m >= 2 && m <= 24)) m = 7;
    buckets = [];
    for (var i = 0; i < m; i++) buckets.push([]);
    lastInsertedAt = -1;
    statusEl.innerHTML = '&nbsp;';
    render();
  }

  function hash(k, m) {
    var x = ((k * 2654435761) >>> 0);
    return x % m;
  }

  function insert(k) {
    var idx = hash(k, m);
    var collide = buckets[idx].length > 0 && buckets[idx].indexOf(k) === -1;
    if (buckets[idx].indexOf(k) === -1) buckets[idx].push(k);
    lastInsertedAt = idx;
    statusEl.textContent = 'h(' + k + ') = ' + idx + (collide ? ' - collision' : '');
    render();
  }

  function render() {
    var html = '';
    for (var i = 0; i < buckets.length; i++) {
      var bucketKeys = buckets[i].map(function (key, j) {
        var collideCls = (i === lastInsertedAt && j === buckets[i].length - 1 && buckets[i].length >= 2) ? ' collide' : '';
        return '<div class="ht-key' + collideCls + '">' + key + '</div>';
      }).join('');
      html += '<div class="ht-bucket"><div class="ht-bucket-head">' + i + '</div>' +
              '<div class="ht-bucket-list">' + bucketKeys + '</div></div>';
    }
    tblEl.innerHTML = html;
  }

  mEl.addEventListener('change', reset);
  document.getElementById('reset').addEventListener('click', reset);
  document.getElementById('ins').addEventListener('click', function () {
    var v = parseInt(kEl.value, 10);
    if (!isNaN(v)) insert(v);
  });

  reset();
  for (var i = 0; i < initial.length; i++) insert(initial[i]);
})();
</script>
