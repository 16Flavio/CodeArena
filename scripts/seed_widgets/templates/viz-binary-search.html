<style>
  .bs-stage { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; }
  .bs-row { display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; padding: 6px 0; }
  .bs-col { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .bs-cell { min-width: 38px; height: 40px; display: flex; align-items: center; justify-content: center;
             border-radius: 6px; background: #e4e4e7; color: #3f3f46;
             font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 700;
             transition: background 0.25s, color 0.25s, outline-color 0.25s; }
  .bs-cell.excl { background: #ececee; color: #b4b4bb; }
  .bs-cell.active { background: #d7e2ec; color: #2b4a68; }
  .bs-cell.mid { background: #f97316; color: #fff; outline: 2px solid #c2410c; outline-offset: 2px; }
  .bs-cell.answer { background: #16a34a; color: #fff; }
  .bs-idx { font-size: 10px; color: #a1a1aa; font-family: ui-monospace, monospace; }
  .bs-ptr { font-size: 11px; height: 14px; font-weight: 700; color: #3a6690;
            font-family: ui-monospace, monospace; }
  html.dark .bs-cell { background: #3f3f46; color: #e4e4e7; }
  html.dark .bs-cell.excl { background: #2a2a2e; color: #6b6b73; }
  html.dark .bs-cell.active { background: #2b3e50; color: #cbd9e6; }
  html.dark .bs-idx { color: #71717a; }
  html.dark .bs-ptr { color: #9cbbd6; }
</style>
<div class="stage bs-stage">
  <div class="bs-row" id="row"></div>
</div>
<div class="info-line" id="info"></div>
<div class="meta-row" id="meta"></div>
<div class="controls">
  <label class="field">tableau trie <input type="text" id="data" value="1,3,4,7,9,11,15,20,25" /></label>
  <label class="field">cible <input type="number" id="target" value="11" /></label>
  <button class="btn-icon-secondary" id="reset" title="load"></button>
  <button class="btn-icon-secondary" id="step" title="step"></button>
  <button class="btn-icon-primary" id="run" title="run"></button>
</div>
<script>
(function () {
  document.getElementById('reset').innerHTML = window.__svg('load');
  document.getElementById('step').innerHTML = window.__svg('step');
  document.getElementById('run').innerHTML = window.__svg('play');

  var info = document.getElementById('info');
  var meta = document.getElementById('meta');
  var dataInput = document.getElementById('data');
  var targetInput = document.getElementById('target');

  var params = window.__params || {};
  if (params.data != null) dataInput.value = params.data.toString().replace(/[\[\]\s]/g, '');
  if (params.target != null) targetInput.value = params.target;

  var A = [], x = 0, steps = [], cur = 0, timer = null;

  function parseArr(s) {
    return s.split(/[^\-0-9]+/).filter(function (t) { return t.length; }).map(Number);
  }

  // Simule lower_bound(A, x) en intervalle semi-ouvert [lo, hi).
  function build() {
    steps = [];
    var lo = 0, hi = A.length;
    steps.push({ lo: lo, hi: hi, mid: null, msg: 'depart : [lo=' + lo + ', hi=' + hi + ')  cible = ' + x });
    while (lo < hi) {
      var mid = Math.floor((lo + hi) / 2);
      if (A[mid] < x) {
        steps.push({ lo: lo, hi: hi, mid: mid, msg: 'A[' + mid + '] = ' + A[mid] + ' < ' + x + '  ->  lo = mid+1 = ' + (mid + 1) });
        lo = mid + 1;
      } else {
        steps.push({ lo: lo, hi: hi, mid: mid, msg: 'A[' + mid + '] = ' + A[mid] + ' >= ' + x + '  ->  hi = mid = ' + mid });
        hi = mid;
      }
    }
    var present = lo < A.length && A[lo] === x;
    steps.push({ lo: lo, hi: hi, mid: null, done: true, answer: lo,
      msg: 'lo = hi = ' + lo + '  ->  lower_bound = ' + lo +
           (present ? '  (cible presente)' : '  (cible absente, position d\'insertion)') });
  }

  function render() {
    var st = steps[cur] || {};
    var row = document.getElementById('row');
    var html = '';
    for (var k = 0; k < A.length; k++) {
      var cls = 'bs-cell';
      if (st.done && k === st.answer) cls += ' answer';
      else if (k === st.mid) cls += ' mid';
      else if (k >= st.lo && k < st.hi) cls += ' active';
      else cls += ' excl';
      var ptr = '';
      if (!st.done) {
        if (k === st.lo && k === st.mid) ptr = 'lo,mid';
        else if (k === st.lo) ptr = 'lo';
        else if (k === st.mid) ptr = 'mid';
        if (k === st.hi && st.hi < A.length) ptr = ptr ? ptr + ',hi' : 'hi';
      } else if (k === st.answer) ptr = 'lower_bound';
      html += '<div class="bs-col"><div class="bs-ptr">' + ptr + '</div>' +
              '<div class="' + cls + '">' + A[k] + '</div>' +
              '<div class="bs-idx">' + k + '</div></div>';
    }
    // sentinelle hi == n (au dela du dernier)
    if (!st.done && st.hi === A.length) {
      html += '<div class="bs-col"><div class="bs-ptr">hi</div>' +
              '<div class="bs-cell excl" style="min-width:20px">]</div>' +
              '<div class="bs-idx">' + A.length + '</div></div>';
    } else if (st.done && st.answer === A.length) {
      html += '<div class="bs-col"><div class="bs-ptr">lower_bound</div>' +
              '<div class="bs-cell answer" style="min-width:20px">]</div>' +
              '<div class="bs-idx">' + A.length + '</div></div>';
    }
    row.innerHTML = html;
    info.textContent = st.msg || '';
    meta.innerHTML = '<span>etape <b>' + Math.min(cur + 1, steps.length) + '</b>/' + steps.length + '</span>' +
      '<span>fenetre <b>' + Math.max(0, st.hi - st.lo) + '</b></span>';
  }

  function load() {
    stopRun();
    A = parseArr(dataInput.value).sort(function (a, b) { return a - b; });
    dataInput.value = A.join(',');
    x = parseInt(targetInput.value, 10) || 0;
    if (!A.length) A = [0];
    build(); cur = 0; render();
  }
  function step() { if (cur < steps.length - 1) { cur++; render(); } }
  function run() {
    if (timer) return;
    if (cur >= steps.length - 1) cur = 0;
    var tick = function () {
      step();
      if (cur >= steps.length - 1) { timer = null; return; }
      timer = setTimeout(tick, 700);
    };
    timer = setTimeout(tick, 700);
  }
  function stopRun() { if (timer) { clearTimeout(timer); timer = null; } }

  document.getElementById('reset').addEventListener('click', load);
  document.getElementById('step').addEventListener('click', function () { stopRun(); step(); });
  document.getElementById('run').addEventListener('click', run);

  load();
})();
</script>
