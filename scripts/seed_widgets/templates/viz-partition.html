<style>
  .pt-stage { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; }
  .pt-row { display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; padding: 6px 0; }
  .pt-cell { min-width: 36px; height: 40px; display: flex; align-items: center; justify-content: center;
             border-radius: 6px; background: #cbd5e1; color: #334155;
             font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 700;
             transition: all 0.25s; }
  .pt-cell.le { background: #a855f7; color: white; }
  .pt-cell.gt { background: #94a3b8; color: white; }
  .pt-cell.pivot { background: #f97316; color: white; outline: 2px solid #c2410c; outline-offset: 2px; }
  .pt-cell.cur { outline: 2px solid #8b5cf6; outline-offset: 2px; }
  .pt-pointers { display: flex; gap: 4px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
                 font-size: 11px; height: 16px; color: #7c3aed; }
  .pt-ptr { min-width: 36px; text-align: center; font-weight: 700; }
  @media (prefers-color-scheme: dark) {
    .pt-cell { background: #475569; color: #e2e8f0; }
    .pt-pointers { color: #c4b5fd; }
  }
</style>
<div class="stage pt-stage">
  <div class="pt-pointers" id="ptrs"></div>
  <div class="pt-row" id="row"></div>
</div>
<div class="info-line" id="info">cliquez sur step pour avancer d'une comparaison</div>
<div class="controls">
  <label class="field">tableau <input type="text" id="data" value="3,7,1,8,4,2,5" /></label>
  <button class="btn-icon-secondary" id="reset" title="load"></button>
  <button class="btn-icon-secondary" id="step"  title="step"></button>
  <button class="btn-icon-primary"   id="run"   title="run"></button>
</div>
<script>
(function () {
  document.getElementById('reset').innerHTML = window.__svg('load');
  document.getElementById('step').innerHTML  = window.__svg('step');
  document.getElementById('run').innerHTML   = window.__svg('play');

  var params = window.__params || {};
  var rawData = (params.data || '3,7,1,8,4,2,5').toString();
  var dataInput = document.getElementById('data');
  if (rawData) dataInput.value = rawData.replace(/[\[\]\s]/g, '');

  var arr = [];
  var i = 0, j = 0, n = 0, pivot = 0, pivotIdx = -1;
  var done = false;
  var step1 = null;

  function load() {
    arr = dataInput.value.split(/[^\-0-9]+/).filter(function (s) { return s.length; }).map(Number);
    n = arr.length;
    if (n < 2) {
      i = 0; j = 0; pivotIdx = n - 1; pivot = arr[n - 1]; done = true;
      render();
      document.getElementById('info').textContent = 'tableau trop petit';
      return;
    }
    pivot = arr[n - 1];
    pivotIdx = n - 1;
    i = 0; j = 0; done = false;
    step1 = 'compare';
    document.getElementById('info').textContent = 'pivot = a[' + (n - 1) + '] = ' + pivot;
    render();
  }

  function step() {
    if (done) return;
    if (step1 === 'compare') {
      if (j >= n - 1) {
        var t = arr[i]; arr[i] = arr[n - 1]; arr[n - 1] = t;
        pivotIdx = i;
        done = true;
        step1 = 'finished';
        document.getElementById('info').textContent = 'fini : pivot en position ' + pivotIdx;
        render();
        return;
      }
      if (arr[j] <= pivot) {
        if (i !== j) { var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
        i++;
        document.getElementById('info').textContent = 'a[' + j + '] = ' + arr[i - 1] + ' ≤ pivot — swap puis i++';
      } else {
        document.getElementById('info').textContent = 'a[' + j + '] = ' + arr[j] + ' > pivot — j++';
      }
      j++;
      render();
    }
  }

  function run() {
    var safety = 1000;
    while (!done && safety-- > 0) step();
  }

  function render() {
    var row = document.getElementById('row');
    var ptrs = document.getElementById('ptrs');
    var cells = '';
    var ptrCells = '';
    for (var k = 0; k < n; k++) {
      var cls = 'pt-cell';
      if (done && k === pivotIdx) cls += ' pivot';
      else if (!done && k === n - 1) cls += ' pivot';
      else if (!done && k < i) cls += ' le';
      else if (!done && k >= i && k < j) cls += ' gt';
      if (!done && k === j) cls += ' cur';
      cells += '<div class="' + cls + '">' + arr[k] + '</div>';
      var ptr = '';
      if (!done && k === i && k === j) ptr = 'i,j';
      else if (!done && k === i) ptr = 'i';
      else if (!done && k === j) ptr = 'j';
      ptrCells += '<div class="pt-ptr">' + ptr + '</div>';
    }
    row.innerHTML = cells;
    ptrs.innerHTML = ptrCells;
  }

  document.getElementById('reset').addEventListener('click', load);
  document.getElementById('step').addEventListener('click', step);
  document.getElementById('run').addEventListener('click', run);

  load();
})();
</script>
